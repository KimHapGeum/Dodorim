<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            color: #1a1a1a; 
            background-color: transparent; 
            overflow: hidden; 
        }

        .header-inner {
            max-width: 1500px;
            margin: 0 auto;
            padding: 0 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            height: 70px;
        }

        .main-logo-top { 
            display: flex; 
            align-items: center; 
            text-decoration: none; 
        }
        .logo-text { 
    font-family: 'Black Han Sans', sans-serif; 
    font-size: 42px; 
    letter-spacing: -1.5px; 
    background: linear-gradient(135deg, #0056b3 0%, #00a0e9 100%);
    
 
    -webkit-background-clip: text;
    background-clip: text; 
    

    -webkit-text-fill-color: transparent;
    color: transparent; 
    
    text-shadow: 2px 3px 5px rgba(0,0,0,0.08);
    line-height: 1;
    display: inline-block;
    padding-top: 2px;
    visibility: hidden;
}
        .logo-text.font-ready { visibility: visible; }
        #btn-area { display: flex; align-items: center; gap: 12px; }

        .font-control-group {
            display: flex;
            align-items: center;
            padding: 3px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 50px;
            margin-bottom: 9px;
            flex-shrink: 0;
        }
        .font-control-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            border: 0;
            border-radius: 50px;
            background: transparent;
            color: #475569;
            font: 800 15px 'Noto Sans KR', sans-serif;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .font-control-button:hover { background: #0056b3; color: #fff; }

        @media (max-width: 800px) {
            .header-inner { padding: 0 16px; }
            .font-control-button { padding: 7px 10px; }
            .font-control-label { display: none; }
        }

        /* 음성 안내 컨트롤 스타일 */
        .voice-control {
            display: flex; 
            align-items: center; 
            background: #f0f2f5;
            padding: 5px 5px 5px 18px; 
            border-radius: 50px; 
            cursor: pointer; 
            border: 2px solid #d1d5db; 
            height: 46px; 
            transition: all 0.2s ease;
            margin-bottom: 9px;
        }
        
        .voice-label { 
            font-weight: 800; 
            font-size: 16px; 
            color: #333; 
            margin-right: 10px;
        }

        .voice-btn { 
            width: 36px; 
            height: 36px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 16px; 
        }

        .voice-on { background: #0056b3; color: white; }
        .voice-off { background: #6c757d; color: white; }

        /* 관리자 로그인 버튼 스타일 */
        .login-btn { 
            padding: 10px 20px; border-radius: 10px; font-weight: 700; border: none; 
            cursor: pointer; font-size: 15px; background: #f1f3f5; color: #495057; 
            margin-bottom: 9px;
        }

        /* 로그아웃 버튼 스타일 */
        .logout-btn {
            background: none; border: none; color: #666; padding: 8px 10px;
            cursor: pointer; font-size: 16px; font-weight: 700;
            display: flex; align-items: center; gap: 8px;
            
        }
    </style>
</head>
<body>
    <div class="header-inner">
        <a href="index.html" target="_top" class="main-logo-top">
            <span class="logo-text">두드림</span>
        </a>
        <div id="btn-area"></div>
    </div>

    <script>
        const logoText = document.querySelector('.logo-text');
        document.fonts.load('42px "Black Han Sans"').then(() => {
            logoText.classList.add('font-ready');
        }).catch(() => {
            logoText.classList.add('font-ready');
        });

        (function() {
            const btnArea = document.getElementById('btn-area');
            const params = new URLSearchParams(window.location.search);
            const type = params.get('type');

            let parentTarget = "";
            try {
                const pathArray = window.parent.location.pathname.split('/');
                parentTarget = pathArray[pathArray.length - 1];
            } catch(e) {
                console.log("iframe 크로스 도메인 제한 체크");
            }

            // 1. 관리자 모드일 때
            if (type === 'manager' || parentTarget === 'manager.html') {
                btnArea.innerHTML = `<button class="logout-btn" onclick="handleLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> 로그아웃</button>`;
            } 
            
            // 2. screen.html은 글자 조절 버튼과 음성 안내 버튼을 헤더 안에 배치
            else if (parentTarget === 'screen.html' || params.get('fontControls') === 'true') {
                btnArea.innerHTML = `
                    <div class="font-control-group" aria-label="설명 글자 크기 조절">
                        <button class="font-control-button" onclick="requestFontSize(2)" aria-label="글자 크게">
                            <i class="fa-solid fa-magnifying-glass-plus"></i><span class="font-control-label">글자 크게</span>
                        </button>
                        <button class="font-control-button" onclick="requestFontSize(-2)" aria-label="글자 작게">
                            <i class="fa-solid fa-magnifying-glass-minus"></i><span class="font-control-label">글자 작게</span>
                        </button>
                    </div>
                    <div class="voice-control" id="voiceToggle" onclick="toggleVoiceLocal()">
                        <div class="voice-label" id="voiceStatus">음성 안내 켜짐</div>
                        <div class="voice-btn voice-on" id="voiceIconBox">
                            <i class="fa-solid fa-volume-high" id="voiceIcon"></i>
                        </div>
                    </div>`;
            }
            // 3. 그 밖의 교육 화면은 음성 안내만 표시
            else if (type === 'edu') {
                btnArea.innerHTML = `
                    <div class="voice-control" id="voiceToggle" onclick="toggleVoiceLocal()">
                        <div class="voice-label" id="voiceStatus">음성 안내 켜짐</div>
                        <div class="voice-btn voice-on" id="voiceIconBox">
                            <i class="fa-solid fa-volume-high" id="voiceIcon"></i>
                        </div>
                    </div>`;
            } 
            
            // 4. 교육하기 다음 대기화면 및 특정 메뉴들 (관리자 로그인 숨김)
            else if (
                type === 'login' || 
                parentTarget === 'login.html' ||
                parentTarget === 'lecture.html' || 
                parentTarget.endsWith('_edu.html') || 
                parentTarget === 'screen_list.html' ||
                parentTarget === 'select_topic.html'
            ) {
                btnArea.innerHTML = ''; 
            } 
            
            // 5. 메인 화면(index.html) 등 기본 상태일 때만 로그인 버튼 노출
            else {
                btnArea.innerHTML = `<button class="login-btn" onclick="window.parent.location.href='login.html'">관리자 로그인</button>`;
            }
        })();

        function requestFontSize(amount) {
            window.parent.postMessage({ type: 'screen-font-size', amount }, '*');
        }

        let isVoiceOn = true;
        function toggleVoiceLocal() {
            isVoiceOn = !isVoiceOn;
            const statusText = document.getElementById('voiceStatus');
            const iconBox = document.getElementById('voiceIconBox');
            const icon = document.getElementById('voiceIcon');

            if (isVoiceOn) {
                statusText.innerText = "음성 안내 켜짐";
                iconBox.className = "voice-btn voice-on";
                icon.className = "fa-solid fa-volume-high";
            } else {
                statusText.innerText = "음성 안내 꺼짐";
                iconBox.className = "voice-btn voice-off";
                icon.className = "fa-solid fa-volume-xmark";
            }

            if (window.parent && typeof window.parent.toggleVoice === 'function') {
                window.parent.toggleVoice(isVoiceOn);
            }
        }

        function handleLogout() {
            if (confirm('로그아웃 하시겠습니까?')) window.parent.location.href = 'index.html';
        }
    </script>
</body>
</html>
