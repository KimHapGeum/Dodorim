<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>두드림 - 공공장소 키오스크 연습</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

    <style>
        /* 기본 레이아웃 */
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            font-family: 'Pretendard', sans-serif;
            background-color: #f4f7fa;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            overflow: hidden !important;
        }

        /* 헤더 */
        #main-header-wrapper {
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            flex-shrink: 0;
            z-index: 1000;
            border-bottom: 1px solid #e2e8f0;
        }

        iframe {
            border: none;
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 중앙 콘텐츠 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 35px;
            overflow: hidden !important;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 상단 제목 그룹 */
        .title-group {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .title-group h1 {
            font-size: 48px;
            font-weight: 800;
            margin: 0;
            color: #0b1a33;
            letter-spacing: -1px;
        }

        .title-group p {
            font-size: 26px;
            color: #222;
            margin-top: 12px;
            font-weight: 700;
        }

        /* 카드 그리드 */
        .lecture-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 90%;
            max-width: 850px;
        }

        .card {
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 28px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #e2e8f0;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
            transition: all 0.25s ease-in-out;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 35px rgba(0, 86, 179, 0.15);
            border-color: #0056b3;
            background-color: #f4f9ff;
        }

        .img-box {
            width: 100%;
            height: 120px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 18px;
            background-color: #ffffff;
        }

        .img-box img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            transition: 0.25s ease-in-out;
        }

        .card:hover img { transform: scale(1.04); }

        .card h2 {
            font-size: 36px;
            margin: 0;
            color: #111;
            font-weight: 900;
        }

        .card:hover h2 { color: #004494; }

        /* 하단 버튼 */
        .bottom-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 35px;
        }

        .btn-back-bottom,
        .btn-suggestion {
            border: none;
            padding: 14px 35px;
            border-radius: 50px;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .btn-back-bottom {
            background: #e2e8f0;
            color: #475569;
            animation-delay: 0.5s;
        }

        .btn-back-bottom:hover {
            background: #cbd5e1;
            color: #1e293b;
            transform: translateY(-2px);
        }

        .btn-suggestion {
            background: #0056b3;
            color: #ffffff;
            animation-delay: 0.6s;
        }

        .btn-suggestion:hover {
            background: #004494;
            transform: translateY(-2px);
        }

        /* ==================================================
           업로드하신 코드의 건의하기 팝업 스타일
        ================================================== */
        .suggestion-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .suggestion-modal.show {
            display: flex;
        }

        .suggestion-box {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            animation: modalOpen 0.25s ease-out;
        }

        @keyframes modalOpen {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .suggestion-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .suggestion-title h2 {
            margin: 0;
            font-size: 30px;
            font-weight: 800;
            color: #0b1a33;
        }

        .suggestion-title i {
            font-size: 28px;
            color: #0056b3;
        }

        .suggestion-description {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #475569;
            font-weight: 600;
        }

        .suggestion-textarea {
            width: 100%;
            height: 200px;
            resize: none;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 18px;
            font-family: 'Pretendard', sans-serif;
            font-size: 18px;
            line-height: 1.6;
            color: #222;
            outline: none;
            background-color: #f8fafc;
            transition: 0.2s;
        }

        .suggestion-textarea:focus {
            border-color: #0056b3;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.1);
        }

        .suggestion-textarea::placeholder { color: #94a3b8; }

        .suggestion-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-btn {
            border: none;
            padding: 13px 28px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-cancel {
            background: #e2e8f0;
            color: #475569;
        }

        .btn-cancel:hover { background: #cbd5e1; }

        .btn-submit {
            background: #0056b3;
            color: #ffffff;
        }

        .btn-submit:hover { background: #004494; }

        /* 푸터 */
        footer {
            padding: 18px 0;
            text-align: center;
            color: #bbb;
            font-size: 14px;
            flex-shrink: 0;
            border-top: 1px solid #eee;
            background: white;
        }

        @media (max-width: 700px) {
            .title-group h1 { font-size: 34px; }
            .title-group p { font-size: 20px; }
            .lecture-grid { width: 94%; gap: 12px; }
            .card { padding: 18px 15px; border-radius: 20px; }
            .card h2 { font-size: 27px; }
            .img-box { height: 90px; }
            .bottom-buttons { gap: 8px; margin-top: 20px; }
            .btn-back-bottom,
            .btn-suggestion { font-size: 17px; padding: 12px 20px; }
            .suggestion-box { padding: 25px 20px; border-radius: 22px; }
            .suggestion-title h2 { font-size: 27px; }
            .suggestion-description { font-size: 17px; line-height: 1.5; }
            .suggestion-textarea { height: 180px; font-size: 17px; }
            .modal-btn { font-size: 17px; padding: 12px 24px; }
        }
    </style>
</head>

<body>

    <!-- 헤더 -->
    <div id="main-header-wrapper">
        <iframe src="./header.html?type=edu" scrolling="no"></iframe>
    </div>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">

        <!-- 제목 -->
        <div class="title-group">
            <h1>공공장소 키오스크 연습하기!</h1>
            <p>자주 방문하는 장소 그림을 살짝 눌러주세요.</p>
        </div>

        <!-- 장소 카드 -->
        <div class="lecture-grid" id="kiosk-list"></div>

        <!-- 하단 버튼 -->
        <div class="bottom-buttons">

            <button
                class="btn-back-bottom"
                onclick="location.href='kiosk_edu.html'">
                <i class="fa-solid fa-arrow-left"></i>
                이전 화면으로 가기
            </button>

            <button
                class="btn-suggestion"
                onclick="openSuggestion()">
                <i class="fa-regular fa-comment-dots"></i>
                건의하기
            </button>

        </div>

    </main>

    <!-- 건의하기 팝업 -->
    <div id="suggestionModal" class="suggestion-modal">

        <div class="suggestion-box" role="dialog" aria-modal="true" aria-labelledby="suggestionTitle">

            <div class="suggestion-title">
                <h2 id="suggestionTitle">건의하기</h2>
                <i class="fa-regular fa-comment-dots"></i>
            </div>

            <p class="suggestion-description">
                두드림에 바라는 점이나 불편한 점을 자유롭게 작성해주세요.
            </p>

            <textarea
                id="suggestionText"
                class="suggestion-textarea"
                maxlength="500"
                placeholder="건의하실 내용을 입력해주세요."></textarea>

            <div class="suggestion-actions">

                <button
                    type="button"
                    class="modal-btn btn-cancel"
                    onclick="closeSuggestion()">
                    취소
                </button>

                <button
                    type="button"
                    class="modal-btn btn-submit"
                    onclick="submitSuggestion()">
                    확인
                </button>

            </div>

        </div>

    </div>

    <!-- 푸터 -->
    <footer>
        © 2026 두드림. 모든 시니어의 디지털 자립을 응원합니다.
    </footer>

    <script>
        // 공공장소 데이터
        const kioskData = [
            {
                name: '민원 / 발급',
                img: 'Public.img/Ma.jpg',
                url: 'screen_list.html'
            },
            {
                name: '기차역',
                img: 'Public.img/ktx.jpg',
                url: 'screen_list.html'
            },
            {
                name: '공항',
                img: 'Public.img/Ai.jpg',
                url: 'screen_list.html'
            },
            {
                name: '영화관',
                img: 'Public.img/tick.jpg',
                url: 'screen_list.html'
            }
        ];

        const listContainer = document.getElementById('kiosk-list');

        kioskData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.animationDelay = (index * 0.1) + 's';

            card.onclick = () => {
                location.href = item.url;
            };

            card.innerHTML = `
                <div class="img-box">
                    <img src="${item.img}" alt="${item.name}">
                </div>
                <h2>${item.name}</h2>
            `;

            listContainer.appendChild(card);
        });

        // 건의하기 팝업 열기
        function openSuggestion() {
            const modal = document.getElementById('suggestionModal');
            const textarea = document.getElementById('suggestionText');

            modal.classList.add('show');

            setTimeout(() => {
                textarea.focus();
            }, 100);
        }

        // 건의하기 팝업 닫기
        function closeSuggestion() {
            const modal = document.getElementById('suggestionModal');
            const textarea = document.getElementById('suggestionText');

            modal.classList.remove('show');
            textarea.value = '';
        }

        // 건의 내용 확인
        // 건의사항 저장 (관리자 건의사항 관리 화면 suggestion.html과 공유)
        const SUGGESTION_STORAGE_KEY = "doodream_suggestions";

        function saveSuggestionToStorage(content) {
            let list = [];
            try {
                list = JSON.parse(localStorage.getItem(SUGGESTION_STORAGE_KEY)) || [];
            } catch (e) {
                list = [];
            }

            const newId = list.length > 0 ? Math.max(...list.map(i => i.id)) + 1 : Date.now();
            const title = content.length > 24 ? content.slice(0, 24) + '…' : content;

            list.push({
                id: newId,
                name: "",
                title: title,
                content: content,
                date: new Date().toISOString().slice(0, 10),
                status: "pending"
            });

            localStorage.setItem(SUGGESTION_STORAGE_KEY, JSON.stringify(list));
        }

        function submitSuggestion() {
            const textarea = document.getElementById('suggestionText');
            const text = textarea.value.trim();

            if (text === '') {
                alert('건의하실 내용을 입력해주세요.');
                textarea.focus();
                return;
            }

            // 현재는 입력 확인 단계입니다.
            // 서버/DB 연결 시 이 부분에서 실제 저장 처리를 추가하면 됩니다.
            saveSuggestionToStorage(text);

            alert('건의해주셔서 감사합니다.');

            textarea.value = '';
            closeSuggestion();
        }

        // 팝업 바깥쪽 클릭 시 닫기
        document.getElementById('suggestionModal').addEventListener('click', function(event) {
            if (event.target === this) {
                closeSuggestion();
            }
        });

        // ESC 키로 닫기
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeSuggestion();
            }
        });

        // 음성 안내 상태
        window.toggleVoice = function(isOn) {
            console.log('공공장소 페이지 음성 안내 상태:', isOn);
        };
    </script>

</body>
</html>
