<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두드림</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* 화면 전체 고정 (스크롤 절대 방지) */
        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #f1f5f9; 
            font-family: 'Noto Sans KR', sans-serif; 
            color: #1e293b;
            display: flex;
            flex-direction: column;
        }

        /* 헤더 디자인 */
        .header { 
            background-color: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(226, 232, 240, 0.8); 
            height: 70px; 
            width: 100%; 
            display: flex; 
            align-items: center; 
            flex-shrink: 0;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.01);
        }
        .header-container { width: 100%; max-width: 1600px; margin: 0 auto; padding: 0 40px; }
        .admin-title { font-size: 24px; font-weight: 900; color: #0f172a; text-decoration: none; letter-spacing: -0.5px; }

        /* [수정] 메인 컨테이너 위아래 여백을 줄여 7개 카드가 들어갈 공간 확보 */
        .container {
            flex: 1;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 30px 60px 25px 60px; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            overflow: hidden; 
        }

        /* 상단 주제 타이틀 영역 (간격 축소) */
        .subject-section {
            margin-bottom: 20px;
            text-align: left; 
            padding-left: 10px;
            flex-shrink: 0;
        }
        .subject-section h1 {
            font-size: 32px;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: -1px;
            margin-bottom: 4px;
        }
        .subject-section p {
            font-size: 17px;
            color: #64748b;
            font-weight: 500;
        }

        /* 가로형 목록 컨테이너 (스크롤바 완전 제거) */
        .lecture-list-container {
            display: flex;
            flex-direction: column;
            gap: 12px; /* 카드 사이 간격을 타이트하게 조절 */
            width: 100%;
            padding: 5px; 
            overflow: hidden; /* 내부 스크롤 발생 방지 */
        }

        /* [수정] 원래의 위아래 텍스트 형태를 유지하되 세로 폭만 슬림하게 줄인 카드 */
        .lecture-row-card {
            background: #ffffff;
            border-radius: 18px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            padding: 15px 35px; /* 세로 여백을 15px로 줄여 컴팩트하게 변경 */
            display: flex;
            align-items: center; 
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 50, 150, 0.01);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 가로 카드 마우스 호버 효과 */
        .lecture-row-card:hover {
            transform: scale(1.005); 
            border-color: #0056b3;
            box-shadow: 0 10px 25px rgba(0, 86, 179, 0.06);
        }

        /* [수정] 기존의 정돈된 상하 텍스트 레이아웃 구조 환원 */
        .lecture-info-text {
            flex: 1;
        }
        .lecture-info-text h2 {
            font-size: 21px; /* 글씨 크기 소폭 최적화 */
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 3px; /* 제목과 설명 사이 간격 최소화 */
            letter-spacing: -0.5px;
            transition: color 0.3s;
        }
        .lecture-row-card:hover .lecture-info-text h2 {
            color: #0056b3;
        }
        .lecture-info-text p {
            font-size: 16px;
            color: #64748b;
            font-weight: 500;
            line-height: 1.4;
        }

        /* 첫 로드 애니메이션 */
        .fade-in-up {
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-container">
            <a href="#" class="admin-title">두드림</a>
        </div>
    </header>

    <main class="container">

        <div class="subject-section fade-in-up">
            <h1>강의 목록</h1>
            <p>원하는 강의를 선택하면 해당 학습 페이지로 즉시 이동합니다.</p>
        </div>

        <div class="lecture-list-container fade-in-up">
            
            <!-- 원래 형태 유지 + 요청 강의 7개 배치 -->
            <div class="lecture-row-card" onclick="startLecture(1)">
                <div class="lecture-info-text">
                    <h2>강의</h2>
                    <p>키오스크 / 병원</p>
                </div>
            </div>

            <div class="lecture-row-card" onclick="startLecture(2)">
                <div class="lecture-info-text">
                    <h2>강의</h2>
                    <p>키오스크 / 공공시설</p>
                </div>
            </div>

            <div class="lecture-row-card" onclick="startLecture(3)">
                <div class="lecture-info-text">
                    <h2>강의</h2>
                    <p>키오스크 / 식당</p>
                </div>
            </div>

            <div class="lecture-row-card" onclick="startLecture(4)">
                <div class="lecture-info-text">
                    <h2>강의</h2>
                    <p>셀프계산대 / 대형매장</p>
                </div>
            </div>

            <div class="lecture-row-card" onclick="startLecture(5)">
                <div class="lecture-info-text">
                    <h2>강의</h2>
                    <p>셀프계산대 / 무인매장</p>
                </div>
            </div>

            <div class="lecture-row-card" onclick="startLecture(6)">
                <div class="lecture-info-text">
                    <h2>강의</h2>
                    <p>전자기기 / 휴대폰</p>
                </div>
            </div>

            <div class="lecture-row-card" onclick="startLecture(7)">
                <div class="lecture-info-text">
                    <h2>강의</h2>
                    <p>전자기기 / ATM</p>
                </div>
            </div>

        </div>

    </main>

    <script>
        function startLecture(stepNumber) {
            window.location.href = `screen.html?step=${stepNumber}`;
        }
    </script>
</body>
</html>
