<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>두드림 - 음식점/카페 선택</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

    <style>
        /* ==================================================
           1. 기본 스타일
        ================================================== */
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden !important;
            font-family: 'Pretendard', sans-serif;
            background-color: #f4f7fa;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
        }

        /* ==================================================
           2. 헤더
        ================================================== */
        #main-header-wrapper {
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            flex-shrink: 0;
            z-index: 1000;
            border-bottom: 1px solid #e2e8f0;
        }

        iframe {
            border: none;
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ==================================================
           3. 메인 콘텐츠
        ================================================== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 35px;
            overflow: hidden !important;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==================================================
           4. 제목
        ================================================== */
        .title-group {
            text-align: center;
            margin-bottom: 25px;
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .title-group h1 {
            font-size: 46px;
            font-weight: 800;
            margin: 0;
            color: #0b1a33;
            letter-spacing: -1px;
        }

        .title-group p {
            font-size: 24px;
            color: #222;
            margin-top: 12px;
            font-weight: 700;
        }

        /* ==================================================
           5. 카드 영역
        ================================================== */
        .topic-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            width: 90%;
        }

        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #e2e8f0;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
            transition: all 0.25s ease-in-out;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 35px rgba(0, 86, 179, 0.15);
            border-color: #0056b3;
            background-color: #f4f9ff;
        }

        .img-box {
            width: 100%;
            height: 100px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 16px;
            background-color: #ffffff;
        }

        .img-box img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            transition: 0.25s ease-in-out;
        }

        .card:hover img {
            transform: scale(1.05);
        }

        .card h2 {
            font-size: 34px;
            margin: 0;
            color: #111;
            font-weight: 900;
        }

        .card:hover h2 {
            color: #004494;
        }

        /* ==================================================
           6. 하단 버튼
        ================================================== */
        .bottom-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-back-bottom,
        .btn-suggestion {
            border: none;
            padding: 12px 32px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);

            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
        }

        /* 이전 버튼 */
        .btn-back-bottom {
            background: #e2e8f0;
            color: #475569;
            animation-delay: 0.5s;
        }

        .btn-back-bottom:hover {
            background: #cbd5e1;
            color: #1e293b;
            transform: translateY(-2px);
        }

        /* 건의하기 버튼 */
        .btn-suggestion {
            background: #0056b3;
            color: #ffffff;
            animation-delay: 0.6s;
        }

        .btn-suggestion:hover {
            background: #004494;
            transform: translateY(-2px);
        }

        /* ==================================================
           7. 건의하기 팝업 배경
        ================================================== */
        .suggestion-modal {
            display: none;

            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.45);

            z-index: 9999;

            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        /* 팝업이 열렸을 때 */
        .suggestion-modal.show {
            display: flex;
        }

        /* ==================================================
           8. 건의하기 팝업창
        ================================================== */
        .suggestion-box {
            width: 100%;
            max-width: 600px;

            background: #ffffff;

            border-radius: 24px;

            padding: 35px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);

            animation: modalOpen 0.25s ease-out;
        }

        @keyframes modalOpen {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* 팝업 제목 */
        .suggestion-title {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 20px;
        }

        .suggestion-title h2 {
            margin: 0;

            font-size: 30px;
            font-weight: 800;

            color: #0b1a33;
        }

        .suggestion-title i {
            font-size: 28px;
            color: #0056b3;
        }

        /* 안내 문구 */
        .suggestion-description {
            margin: 0 0 15px 0;

            font-size: 18px;
            color: #475569;
            font-weight: 600;
        }

        /* 입력창 */
        .suggestion-textarea {
            width: 100%;
            height: 200px;

            resize: none;

            border: 2px solid #e2e8f0;
            border-radius: 16px;

            padding: 18px;

            font-family: 'Pretendard', sans-serif;
            font-size: 18px;
            line-height: 1.6;

            color: #222;

            outline: none;

            background-color: #f8fafc;

            transition: 0.2s;
        }

        .suggestion-textarea:focus {
            border-color: #0056b3;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.1);
        }

        .suggestion-textarea::placeholder {
            color: #94a3b8;
        }

        /* ==================================================
           9. 팝업 하단 버튼
        ================================================== */
        .suggestion-actions {
            display: flex;

            justify-content: flex-end;

            gap: 12px;

            margin-top: 20px;
        }

        .modal-btn {
            border: none;

            padding: 13px 28px;

            border-radius: 50px;

            font-size: 18px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        /* 취소 */
        .btn-cancel {
            background: #e2e8f0;
            color: #475569;
        }

        .btn-cancel:hover {
            background: #cbd5e1;
        }

        /* 완료 */
        .btn-submit {
            background: #0056b3;
            color: #ffffff;
        }

        .btn-submit:hover {
            background: #004494;
        }

        /* ==================================================
           10. 푸터
        ================================================== */
        footer {
            padding: 18px 0;
            text-align: center;
            color: #bbb;
            font-size: 14px;
            flex-shrink: 0;
            border-top: 1px solid #eee;
            background: white;
        }
    </style>
</head>

<body>

    <!-- ==================================================
         헤더
    ================================================== -->
    <div id="main-header-wrapper">
        <iframe src="./header.html?type=edu" scrolling="no"></iframe>
    </div>


    <!-- ==================================================
         메인 콘텐츠
    ================================================== -->
    <main class="main-content">

        <div class="title-group">
            <h1>어디에서 주문해볼까요?</h1>
            <p>연습하고 싶은 장소 그림을 살짝 눌러주세요.</p>
        </div>


        <!-- 음식점 / 카페 카드 -->
        <div class="topic-container" id="kiosk-list">
        </div>


        <!-- 하단 버튼 -->
        <div class="bottom-buttons">

            <!-- 이전 화면 -->
            <button
                class="btn-back-bottom"
                onclick="location.href='kiosk_edu.html'">

                <i class="fa-solid fa-arrow-left"></i>
                이전 화면으로 가기

            </button>


            <!-- 건의하기 -->
            <button
                class="btn-suggestion"
                onclick="openSuggestion()">

                <i class="fa-regular fa-comment-dots"></i>
                건의하기

            </button>

        </div>

    </main>


    <!-- ==================================================
         건의하기 팝업
    ================================================== -->
    <div
        id="suggestionModal"
        class="suggestion-modal">

        <div class="suggestion-box">

            <!-- 팝업 제목 -->
            <div class="suggestion-title">

                <h2>건의하기</h2>

                <i class="fa-regular fa-comment-dots"></i>

            </div>


            <!-- 안내 문구 -->
            <p class="suggestion-description">
                두드림에 바라는 점이나 불편한 점을 자유롭게 작성해주세요.
            </p>


            <!-- 내용 입력 -->
            <textarea
                id="suggestionText"
                class="suggestion-textarea"
                placeholder="건의하실 내용을 입력해주세요."></textarea>


            <!-- 완료 / 취소 버튼 -->
            <div class="suggestion-actions">

                <button
                    class="modal-btn btn-cancel"
                    onclick="closeSuggestion()">

                    취소

                </button>

                <button
                    class="modal-btn btn-submit"
                    onclick="submitSuggestion()">

                    완료

                </button>

            </div>

        </div>

    </div>


    <!-- ==================================================
         푸터
    ================================================== -->
    <footer>
        © 2026 두드림. 모든 시니어의 디지털 자립을 응원합니다.
    </footer>


    <script>

        /* ==================================================
           음식점 / 카페 데이터
        ================================================== */

        const kioskData = [
            {
                name: '버거킹',
                img: 'Image/bu.jpg',
                url: 'screen_list.html'
            },
            {
                name: '롯데리아',
                img: 'Image/lo.jpg',
                url: 'screen_list.html'
            },
            {
                name: '맥도날드',
                img: 'Image/ma.jpg',
                url: 'screen_list.html'
            },
            {
                name: '메가커피',
                img: 'Image/me.jpg',
                url: 'screen_list.html'
            },
            {
                name: '컴포즈',
                img: 'Image/co.jpg',
                url: 'screen_list.html'
            },
            {
                name: '스타벅스',
                img: 'Image/st.jpg',
                url: 'screen_list.html'
            }
        ];


        /* ==================================================
           카드 생성
        ================================================== */

        const listContainer =
            document.getElementById('kiosk-list');


        kioskData.forEach((item, index) => {

            const card =
                document.createElement('div');

            card.className = 'card';

            card.style.animationDelay =
                (index * 0.08) + 's';


            card.onclick = () => {
                location.href = item.url;
            };


            card.innerHTML = `
                <div class="img-box">
                    <img
                        src="${item.img}"
                        alt="${item.name}">
                </div>

                <h2>${item.name}</h2>
            `;


            listContainer.appendChild(card);

        });


        /* ==================================================
           건의하기 팝업 열기
        ================================================== */

        function openSuggestion() {

            const modal =
                document.getElementById('suggestionModal');

            modal.classList.add('show');

            // 입력창에 바로 커서
            setTimeout(() => {

                document
                    .getElementById('suggestionText')
                    .focus();

            }, 100);

        }


        /* ==================================================
           건의하기 팝업 닫기
        ================================================== */

        function closeSuggestion() {

            const modal =
                document.getElementById('suggestionModal');

            modal.classList.remove('show');

        }


        /* ==================================================
           건의 내용 완료
        ================================================== */

        // 건의사항 저장 (관리자 건의사항 관리 화면 suggestion.html과 공유)
        const SUGGESTION_STORAGE_KEY = "doodream_suggestions";

        function saveSuggestionToStorage(content) {
            let list = [];
            try {
                list = JSON.parse(localStorage.getItem(SUGGESTION_STORAGE_KEY)) || [];
            } catch (e) {
                list = [];
            }

            const newId = list.length > 0 ? Math.max(...list.map(i => i.id)) + 1 : Date.now();
            const title = content.length > 24 ? content.slice(0, 24) + '…' : content;

            list.push({
                id: newId,
                name: "",
                title: title,
                content: content,
                date: new Date().toISOString().slice(0, 10),
                status: "pending"
            });

            localStorage.setItem(SUGGESTION_STORAGE_KEY, JSON.stringify(list));
        }

        function submitSuggestion() {

            const text =
                document
                    .getElementById('suggestionText')
                    .value
                    .trim();


            // 내용이 없는 경우
            if (text === '') {

                alert('건의하실 내용을 입력해주세요.');

                document
                    .getElementById('suggestionText')
                    .focus();

                return;
            }


            /*
             * 현재는 화면에서 입력 내용을 확인하는
             * 간단한 형태입니다.
             *
             * 나중에 서버 / DB와 연결하면
             * 이 부분에서 실제로 저장할 수 있습니다.
             */

            saveSuggestionToStorage(text);

            alert('건의해주셔서 감사합니다.');


            // 입력창 초기화
            document
                .getElementById('suggestionText')
                .value = '';


            // 팝업 닫기
            closeSuggestion();

        }


        /* ==================================================
           팝업 바깥쪽 클릭 시 닫기
        ================================================== */

        document
            .getElementById('suggestionModal')
            .addEventListener('click', function(event) {

                // 팝업 박스 자체가 아닌
                // 어두운 배경을 클릭했을 때만 닫기
                if (event.target === this) {

                    closeSuggestion();

                }

            });


        /* ==================================================
           ESC 키로 팝업 닫기
        ================================================== */

        document.addEventListener('keydown', function(event) {

            if (event.key === 'Escape') {

                closeSuggestion();

            }

        });


        /* ==================================================
           음성 안내 연동
        ================================================== */

        window.toggleVoice = function(isOn) {

            console.log(
                "카페/음식점 페이지 음성 안내 상태:",
                isOn
            );

        };

    </script>

</body>
</html>
