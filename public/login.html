<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두드림 - 로그인</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f7f9fc; color: #1a1a1a; overflow: hidden; }
        .page-wrapper { height: 100vh; display: flex; flex-direction: column; }

        /* ✅ 헤더 영역: iframe을 감싸는 컨테이너 */
        .header-wrapper {
            background-color: #ffffff;
            border-bottom: 1px solid #f0f0f0;
            height: 60px; /* header.html의 height와 일치시킴 */
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .header-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* 로그인 메인 섹션 */
        .login-main-section { flex: 1; display: flex; justify-content: center; align-items: center; }
        .login-container { width: 100%; max-width: 440px; padding: 0 20px; text-align: center; }
        .welcome-text { font-size: 32px; font-weight: 800; margin-bottom: 50px; }
        
        .input-section { margin-bottom: 25px; text-align: left; }
        .input-label { display: block; font-size: 15px; font-weight: 700; margin-bottom: 10px; }
        .input-section input {
            width: 100%; padding: 18px; border: 1px solid transparent; border-radius: 12px;
            background-color: #ffffff; font-size: 16px; transition: 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .input-section input:focus { outline: none; border-color: #0056b3; }

        .btn-login {
            width: 100%; padding: 18px; background-color: #0056b3; color: #fff;
            border: none; border-radius: 14px; font-size: 18px; font-weight: 800; 
            cursor: pointer; margin-top: 10px; transition: 0.3s;
        }
        .btn-login:hover { background-color: #004494; transform: translateY(-2px); }

        .main-footer { padding: 18px 0; text-align: center; color: #bbb; font-size: 14px; border-top: 1px solid #f0f0f0; background: white; }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="header-wrapper">
            <iframe src="header.html?type=login" scrolling="no"></iframe>
        </div>

        <main class="login-main-section">
            <div class="login-container">
                <h2 class="welcome-text">관리자 로그인</h2>
                <form id="loginForm">
                    <div class="input-section">
                        <label class="input-label">아이디</label>
                        <input type="text" id="id" placeholder="아이디를 입력하세요" required>
                    </div>
                    <div class="input-section">
                        <label class="input-label">비밀번호</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-login">로그인</button>
                </form>
            </div>
        </main>

        <footer class="main-footer">
            <p>© 2026 두드림, 모든 시니어의 디지털 자립을 응원합니다.</p>
        </footer>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // 로그인 성공 시 관리자 페이지로 이동
            location.href = 'manager.html'; 
        });
    </script>
</body>
</html>
