<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 - 강의 수정</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f7f9fc; color: #1a1a1a; overflow-x: hidden; }
        .viewport { width: 100vw; overflow: hidden; }
        .slider-container { display: flex; width: 300vw; transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .page { width: 100vw; min-height: 100vh; flex-shrink: 0; padding-bottom: 50px; }
        
        /* 헤더 제거 후 메인 상단 여백 보정 */
        .main-content { width: 100%; max-width: 1200px; margin: 0 auto; padding: 40px; }
        .form-card { background: white; padding: 50px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .input-group { margin-bottom: 30px; }
        .input-group label { display: block; font-weight: 700; margin-bottom: 12px; font-size: 18px; }
        .text-input { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid #f0f0f0; font-size: 16px; outline: none; }
        .select-group { display: flex; gap: 10px; }
        .select-box { flex: 1; padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px; outline: none; background: #fff; }
        .upload-row { display: flex; gap: 20px; margin-bottom: 20px; }
        
        /* 사진 업로드 박스 디자인 */
        .upload-box { flex: 1; height: 250px; border: 2px dashed #ddd; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; background: #fafafa; position: relative; overflow: hidden; }
        .upload-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 5; }
        .textarea-input { flex: 1; height: 250px; padding: 20px; border-radius: 15px; border: 2px solid #f0f0f0; resize: none; font-size: 16px; outline: none; }
        .footer-nav { display: flex; justify-content: space-between; gap: 20px; }
        .btn-nav { flex: 1; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; border: none; }
        .btn-back { background: #eee; color: #666; }
        .btn-next { background: #0056b3; color: white; }
        .btn-save { background: #0056b3; color: white; }
    </style>
</head>
<body>

<div class="viewport">
    <div class="slider-container" id="editSlider">
        
        <div class="page">
            <main class="main-content">
                <div class="form-card">
                    <div class="input-group"><label>강의 제목 수정</label><input type="text" id="editTitle" class="text-input" placeholder="제목을 입력하세요"></div>
                    <div class="input-group"><label>카테고리 재설정</label>
                        <div class="select-group">
                            <select class="select-box" id="editM"><option value="">대단원 선택</option></select>
                            <select class="select-box" id="editD"><option value="">중단원 선택</option></select>
                            <select class="select-box" id="editS"><option value="">소단원 선택</option></select>
                        </div>
                    </div>
                    <div class="footer-nav"><button class="btn-nav btn-back" onclick="location.href='manager.html'">취소</button><button class="btn-nav btn-next" onclick="moveSlide(1)">다음 단계</button></div>
                </div>
            </main>
        </div>

        <div class="page">
            <main class="main-content">
                <div class="form-card">
                    <div class="upload-row">
                        <div class="upload-box" onclick="document.getElementById('editFilePic').click()" id="editPicView">
                            <i class="fa-solid fa-camera" style="font-size:40px; color:#ccc;"></i>
                            <span style="margin-top:10px; color:#999; font-weight:600;">메인 사진 교체</span>
                            <input type="file" id="editFilePic" hidden accept="image/*" onchange="previewImg(this)">
                        </div>
                        <textarea class="textarea-input" id="editDesc" placeholder="설명을 입력하세요"></textarea>
                    </div>
                    <div class="footer-nav"><button class="btn-nav btn-back" onclick="moveSlide(0)">이전 단계</button><button class="btn-nav btn-next" onclick="moveSlide(2)">다음 단계</button></div>
                </div>
            </main>
        </div>

        <div class="page">
            <main class="main-content">
                <div class="form-card" style="text-align:center;">
                    <h2 style="margin-bottom:10px;">자료 수정 완료</h2><p style="color:#888; margin-bottom:40px;">동영상 및 참고 자료를 수정하고 저장을 누르세요.</p>
                    <div class="upload-row">
                        <div class="upload-box" onclick="document.getElementById('editVid').click()">
                            <i class="fa-solid fa-circle-play" style="font-size:35px; color:#0056b3;"></i><span id="vidName" style="margin-top:10px; font-weight:600;">동영상 변경</span>
                            <input type="file" id="editVid" hidden accept="video/*" onchange="updateFN(this, 'vidName')">
                        </div>
                        <div class="upload-box" onclick="document.getElementById('editEtc').click()">
                            <i class="fa-solid fa-file-pdf" style="font-size:35px; color:#0056b3;"></i><span id="etcName" style="margin-top:10px; font-weight:600;">문서 변경</span>
                            <input type="file" id="editEtc" hidden onchange="updateFN(this, 'etcName')">
                        </div>
                    </div>
                    <div class="footer-nav" style="margin-top:40px;"><button class="btn-nav btn-back" onclick="moveSlide(1)">이전 단계</button><button class="btn-nav btn-save" onclick="saveToS4()">수정 완료 및 저장</button></div>
                </div>
            </main>
        </div>

    </div>
</div>

<script>
    const slider = document.getElementById('editSlider');
    
    // 🛠️ "전자기기" 단원 데이터를 다른 페이지와 일치하도록 동기화했습니다.
    const categoryData = { 
        "키오스크": { 
            "병원": ["동네병원", "종합병원", "약국 수납"], 
            "공공시설": ["민원/발급", "기차역", "공항", "영화관"], 
            "음식점/카페": ["버거킹", "롯데리아", "맥도날드", "메가커피", "컴포즈", "스타벅스"] 
        }, 
        "셀프 계산대": { 
            "대형 매장": ["다이소", "홈플러스"], 
            "무인 매장": ["아이스크림", "무인편의점"] 
        },
        "전자기기": {
            "휴대폰": ["전화/문자하기"],
            "ATM": ["KB 국민은행", "NH 농협은행"]
        }
    };

    let lectures = JSON.parse(localStorage.getItem('myLectures')) || [];
    let targetIdx = new URLSearchParams(window.location.search).get('id');
    let tempImg = ""; 

    function moveSlide(idx) { slider.style.transform = `translateX(-${idx * 100}vw)`; window.scrollTo(0,0); }

    window.onload = () => {
        initCategory();
        if(targetIdx !== null && lectures[targetIdx]) {
            const data = lectures[targetIdx];
            document.getElementById('editTitle').value = data.title;
            document.getElementById('editDesc').value = data.desc || "";
            
            if(data.img) {
                tempImg = data.img;
                renderPreview(tempImg);
            }

            const pArr = data.path.split(' > ');
            const m = document.getElementById('editM'), d = document.getElementById('editD'), s = document.getElementById('editS');
            m.value = pArr[0] || ""; m.dispatchEvent(new Event('change'));
            d.value = pArr[1] || ""; d.dispatchEvent(new Event('change'));
            s.value = pArr[2] || "";
        }
    };

    function initCategory() {
        const m = document.getElementById('editM'), d = document.getElementById('editD'), s = document.getElementById('editS');
        for (let k in categoryData) m.options.add(new Option(k, k));
        m.onchange = () => { d.innerHTML = '<option value="">중단원 선택</option>'; s.innerHTML = '<option value="">소단원 선택</option>'; if(m.value) for(let k in categoryData[m.value]) d.options.add(new Option(k, k)); };
        d.onchange = () => { s.innerHTML = '<option value="">소단원 선택</option>'; if(d.value) categoryData[m.value][d.value].forEach(v => s.options.add(new Option(v, v))); };
    }

    function previewImg(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                tempImg = e.target.result; 
                renderPreview(tempImg);
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function renderPreview(src) {
        const view = document.getElementById('editPicView');
        view.innerHTML = `
            <i class="fa-solid fa-camera" style="font-size:40px; color:#ccc;"></i>
            <span style="margin-top:10px; color:#999; font-weight:600;">메인 사진 교체</span>
            <input type="file" id="editFilePic" hidden accept="image/*" onchange="previewImg(this)">
            <img src="${src}" style="width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0; z-index:10;">
        `;
    }

    function updateFN(input, id) { if(input.files[0]) document.getElementById(id).innerText = input.files[0].name; }

    function saveToS4() {
        if (targetIdx === null) return;
        
        const title = document.getElementById('editTitle').value;
        const m = document.getElementById('editM').value;
        const d = document.getElementById('editD').value;
        const s = document.getElementById('editS').value;

        if(!title) return alert("강의 제목을 입력해주세요.");

        lectures[targetIdx] = {
            title: title,
            path: `${m} > ${d} > ${s}`,
            img: tempImg, 
            desc: document.getElementById('editDesc').value
        };

        localStorage.setItem('myLectures', JSON.stringify(lectures));
        alert("수정사항이 완벽하게 저장되었습니다.");
        
        // 🛠️ 저장 완료 후 목록 관리 홈 페이지인 manager.html로 돌아갑니다.
        location.href = "manager.html";
    }
</script>
</body>
</html>
